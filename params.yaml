# Every number that changes a result lives here, not in the code.
# Change one, run `dvc repro`, and DVC reruns only what depends on it.

test_size: 0.2        # how much data is held out for testing
random_state: 42      # fixed seed, so two runs are comparable
n_estimators: 400     # trees in the forest
max_depth: 6       # how deep each tree may grow
