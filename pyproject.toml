[project]
name = "mle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jiří Svítil", email = "jirka.svitil@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "dvc>=3.50",
    "pytest>=7.0",
    "ruff>=0.5",
    "pre-commit>=3.5",
]

[project.optional-dependencies]
# GPU training on AMD via ROCm. Install with: uv sync --extra gpu
# NOTE: Radeon 880M (gfx1150) is NOT officially supported by prebuilt
# torch ROCm wheels -- this is experimental, CPU remains the default.
gpu = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]

[project.scripts]
mle = "mle:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
