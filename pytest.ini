[pytest]
# `pythonpath = src` lets tests import data.py / train.py from src/,
# so the project needs no packaging and no `pip install -e .`.
pythonpath = src
testpaths = tests
# Exercises are deselected by default, so a fresh clone is green.
# Run them with: pytest -m exercise
addopts = -q -m "not exercise"
markers =
    exercise: student exercises, unfinished until you fill them in
